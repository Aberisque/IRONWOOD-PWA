plugins {
    id 'com.android.application'
}
android {
    namespace 'com.crimson.command'
    compileSdk 35
    defaultConfig {
        applicationId "com.crimson.command"
        minSdk 26
        targetSdk 34
        versionCode 21
        versionName "2.1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
